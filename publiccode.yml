description:
  en:
    localisedName: Sour rot
    shortDescription: 'Codes associated to the paper "Revisiting sour rot of
      grapevine through disease-associated microbiomes: a tripartite
      co-infection?"'
    longDescription: 'Repository associated to the paper "Revisiting sour rot of
      grapevine through disease-associated microbiomes: a tripartite
      co-infection?". We provide all the data used in the paper in the folder
      Data. In addition to providing the data and for the sake of
      reproducibility, we provide the codes that have produced the analyses and
      the figures of this paper. The codes are provided in the Rmarkdown file
      Reproducing_figures_sour_rot.Rmd, that both produce the results and gives
      details about how they are obtained, so as to make all the preprocessing
      steps fully transparent.'
    documentation: https://github.com/agroscope-ch/sour-rot/
